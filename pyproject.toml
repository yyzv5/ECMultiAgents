[project]
name = "ecmultiagents"
version = "0.1.0"
description = "Cross-border e-commerce multi-agent demo"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.0,<5.0",
    "fastapi>=0.115,<1.0",
    "flagembedding>=1.3,<2.0",
    "httpx>=0.27,<1.0",
    "langchain>=0.3,<1.0",
    "langchain-community>=0.3,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-openai>=0.3,<1.0",
    "langchain-text-splitters>=0.3,<1.0",
    "langgraph>=0.2,<1.0",
    "langgraph-checkpoint-sqlite>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pymilvus>=2.4,<3.0",
    "python-jose>=3.3,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "tavily-python>=0.5,<1.0",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: marks tests that load real ML models (BGE-M3 / Reranker) as slow; filter with -m 'not slow'",
]
