[project]
name = "ecmultiagents"
version = "0.1.0"
description = "Cross-border e-commerce multi-agent demo"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
